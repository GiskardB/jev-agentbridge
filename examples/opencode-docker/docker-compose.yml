services:
  jev:
    build: ../..
    ports:
      - "18000:8000"
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    environment:
      - JEV_HOST=0.0.0.0
      - JEV_PORT=8000
      # When building from source, set the engine explicitly. Published images
      # (:semif, :laya, :rizzoflow) already bake this in.
      # - JEV_ENGINE=laya
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  opencode:
    build:
      context: ../..
      dockerfile: examples/opencode-docker/Dockerfile
    depends_on:
      jev:
        condition: service_healthy
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-qwen/qwen3-32b}
      - JEV_URL=http://jev:8000
    volumes:
      - ./shared:/shared
    command: >
      sh -c "
        python /app/test_integration.py
        && tail -f /dev/null
      "
    restart: "no"

volumes:
  huggingface-cache:

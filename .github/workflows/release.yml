name: release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        # "" = default image (semif only). Add an entry here for each engine that needs its own
        # dependencies baked in (see Dockerfile's ENGINE_EXTRA build arg). rizzoflow needs none
        # (it's a plain HTTP client), so it doesn't get a variant.
        extra: ["", "laya"]
    steps:
      - uses: actions/checkout@v4

      - name: Pick a registry and image name for this instance
        id: registry
        run: |
          if [ "${{ github.server_url }}" = "https://github.com" ]; then
            echo "host=ghcr.io" >> "$GITHUB_OUTPUT"
          else
            echo "host=$(echo '${{ github.server_url }}' | sed -E 's#https?://##')" >> "$GITHUB_OUTPUT"
          fi
          echo "image=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Compute image tags for this variant
        id: tags
        run: |
          BASE="${{ steps.registry.outputs.host }}/${{ steps.registry.outputs.image }}"
          VERSION="${GITHUB_REF_NAME#v}"
          MAJOR_MINOR="${VERSION%.*}"
          EXTRA="${{ matrix.extra }}"
          SUFFIX=""
          MOVING="latest"
          if [ -n "$EXTRA" ]; then
            SUFFIX="-$EXTRA"
            MOVING="$EXTRA"
          fi
          {
            echo "tags<<TAGEOF"
            echo "$BASE:${VERSION}${SUFFIX}"
            echo "$BASE:${MAJOR_MINOR}${SUFFIX}"
            echo "$BASE:${MOVING}"
            echo "TAGEOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            ENGINE_EXTRA=${{ matrix.extra }}
          tags: ${{ steps.tags.outputs.tags }}

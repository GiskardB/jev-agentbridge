[build-system]
requires = ["setuptools>=70.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-agentbridge-sdk"
version = "0.2.0"
description = "Python SDK for JEV-AgentBridge"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27.0"]

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["jev_agent_bridge"]

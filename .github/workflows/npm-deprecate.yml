name: npm-deprecate

# One-shot manual workflow to deprecate an npm package using the existing
# NPM_TOKEN secret. Not triggered by pushes/tags. Remove after use.
on:
  workflow_dispatch:
    inputs:
      package:
        description: "npm package name"
        required: true
        default: "opencode-jev-agentbridge"
      message:
        description: "Deprecation message"
        required: true
        default: "Use the MCP endpoint: https://github.com/GiskardB/jev-agentbridge/blob/main/docs/mcp.md"

jobs:
  deprecate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - run: npm deprecate "${{ inputs.package }}" "${{ inputs.message }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

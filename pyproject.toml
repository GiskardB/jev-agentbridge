[build-system]
requires = ["setuptools>=70.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-agentbridge"
version = "0.6.0"
description = "JEV-AgentBridge — standard decision REST API over pluggable JEV decision engines"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "transformers>=4.45.0",
    "torch>=2.5.0",
    "python-dotenv>=1.0.0",
    # laya is the default engine since 0.4.0, so it is a core dependency now.
    "laya>=0.3.0",
    "mcp>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.8.0",
    "mypy>=1.10.0",
    "pytest-xdist>=3.0.0",
]
# Kept so `pip install jev-agentbridge[laya]` keeps working; laya is now a core dependency.
laya = []

[project.scripts]
jev-decide = "jev_agentbridge.main:main"
jev-eval = "jev_agentbridge.evaluation:main"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live_model: Mark test as requiring the model to be downloaded",
    "conformance: Mark conformance test against SemIf/JEV-CPU reference",
]

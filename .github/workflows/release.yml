name: release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        # One image per engine. The engine is baked in via the Dockerfile's
        # JEV_ENGINE ENV (ENGINE build arg), so the image tag alone determines
        # the runtime engine — no -e JEV_ENGINE needed. laya is the default
        # engine and gets :latest (plus :laya); the others get suffixed tags.
        engine: ["laya", "semif", "rizzoflow"]
    steps:
      - uses: actions/checkout@v4

      - name: Pick a registry and image name for this instance
        id: registry
        run: |
          if [ "${{ github.server_url }}" = "https://github.com" ]; then
            echo "host=ghcr.io" >> "$GITHUB_OUTPUT"
          else
            echo "host=$(echo '${{ github.server_url }}' | sed -E 's#https?://##')" >> "$GITHUB_OUTPUT"
          fi
          echo "image=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Compute image tags for this variant
        id: tags
        run: |
          BASE="${{ steps.registry.outputs.host }}/${{ steps.registry.outputs.image }}"
          VERSION="${GITHUB_REF_NAME#v}"
          MAJOR_MINOR="${VERSION%.*}"
          ENGINE="${{ matrix.engine }}"
          SUFFIX=""
          if [ "$ENGINE" != "laya" ]; then
            SUFFIX="-$ENGINE"
          fi
          {
            echo "tags<<TAGEOF"
            echo "$BASE:${VERSION}${SUFFIX}"
            echo "$BASE:${MAJOR_MINOR}${SUFFIX}"
            echo "$BASE:${ENGINE}"
            if [ "$ENGINE" = "laya" ]; then echo "$BASE:latest"; fi
            echo "TAGEOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            ENGINE=${{ matrix.engine }}
          tags: ${{ steps.tags.outputs.tags }}